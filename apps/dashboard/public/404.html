<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080d0a" />
    <title>404 — RouteFusion</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d0a;color:#ecf5ef;font:15px/1.6 system-ui,sans-serif}.card{width:min(680px,calc(100% - 32px));padding:clamp(28px,7vw,64px);border:1px solid #20372a;border-radius:18px;background:radial-gradient(ellipse at 88% 15%,#0b3c2780,transparent 50%),#0d1510;box-shadow:0 30px 100px #0008}.logo{width:min(270px,75%);height:auto;display:block;margin:0 0 34px}.code{font:700 clamp(90px,20vw,160px)/.85 ui-monospace,monospace;letter-spacing:-.1em;color:#27e985;text-shadow:0 0 38px #00d87845}.rule{height:2px;width:80px;background:#27e985;margin:28px 0 22px;box-shadow:0 0 18px #27e985}.card h1{font-size:clamp(22px,4vw,34px);margin:0}.card p{max-width:440px;color:#9ab1a2}.card a{display:inline-block;margin-top:14px;padding:10px 15px;border-radius:8px;background:#27e985;color:#062313;text-decoration:none;font-weight:700}.card a:focus-visible{outline:3px solid #eafff3;outline-offset:3px}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/routefusion-logo.png" alt="RouteFusion" />
      <div class="code">404</div>
      <div class="rule"></div>
      <h1>This route is off the map.</h1>
      <p>The address may have changed, or the page may not exist in this control plane.</p>
      <a href="/">Return to RouteFusion</a>
    </main>
  </body>
</html>
